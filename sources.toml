# Public JAIN University pages for the workshop knowledge base.
# Each [[page]] is fetched and its main text extracted. Add `extract = "full"`
# for pages whose facts sit in small cards (contacts, stats) that main-text
# extraction drops; that keeps all visible text minus header, nav and footer.
# Each [[text_dir]] is an Apache-style directory listing of .txt files
# that the university publishes for LLMs (allowed in robots.txt); every .txt
# in it, and in its subfolders, is collected as-is.
#
# robots.txt on these hosts disallows *.pdf, /naac, /news/, /events/ and
# query-string URLs, so none of those appear here and the collector refuses them.

[[text_dir]]
url = "https://www.jainuniversity.ac.in/llms-ju/"
category = "programs"

[[text_dir]]
url = "https://scsit.jainuniversity.ac.in/llms-scsit/"
category = "programs-cs-it"

